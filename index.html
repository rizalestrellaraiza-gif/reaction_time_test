<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reaction Time Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
body{margin:0;font-family:Arial,Segoe UI,Helvetica,sans-serif;background:#fff;color:#111;text-align:center;overflow:hidden}
#container{padding:4vh 6%;margin-top:6vh}
input,button{font-size:18px;padding:10px;border-radius:8px}
#start,#download{background:#007bff;color:#fff;border:0;padding:14px 30px;margin-top:12px;cursor:pointer}
#stimulus,#fixation,#countdown{position:absolute;display:none;z-index:1000;transition:all 0.12s}
#stimulus{width:150px;height:150px;border-radius:50%;cursor:pointer;}
#fixation,#countdown{width:100vw;height:100vh;text-align:center;line-height:100vh;font-size:90px;}
#countdown{font-size:120px;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000}
#trialCounter{position:absolute;width:100%;text-align:center;top:10px;font-size:22px;color:gray}
table{margin:auto;border-collapse:collapse;margin-top:14px}
th,td{padding:8px;border:1px solid #ddd;text-align:center}
</style>
</head>
<body>

<div id="container">
<h1>Reaction Time Test</h1>
<p><strong>TAP THE SPACE BAR (OR TAP THE SCREEN)</strong> AS SOON AS YOU SEE THE COLOR APPEAR.</p>
<div style="margin-top:10px">
<label for="pid">Participant ID</label><br>
<input id="pid" type="text" placeholder="e.g., P001" style="width:220px">
</div>
<div style="margin-top:14px">
<button id="start">Start Reaction Test</button>
</div>
</div>

<div id="trialCounter"></div>
<div id="fixation">+</div>
<div id="countdown"></div>
<div id="stimulus" role="button" aria-label="Stimulus"></div>

<script>
/* ================= CONFIG ================= */
const CONFIG={repsPerColor:2,fixationMsMin:700,fixationMsMax:1500,itiMinMs:800,itiMaxMs:3000,maxSameTypeRun:1};

/* ================= COLORS ================= */
const neonColors=[
{id:'N1',name:'Neon Yellow',color:'#FFFF00',glow:'0 0 30px #FFFF66',type:'Neon'},
{id:'N2',name:'Neon Pink',color:'#FF00FF',glow:'0 0 30px #FF66FF',type:'Neon'},
{id:'N3',name:'Neon Orange',color:'#FF5E00',glow:'0 0 30px #FF9933',type:'Neon'}
];
const neutralColors=[
{id:'U1',name:'Beige',color:'#E6D8B3',glow:'none',type:'Neutral'},
{id:'U2',name:'Gray',color:'#B0B0B0',glow:'none',type:'Neutral'},
{id:'U3',name:'Light Brown',color:'#C4A484',glow:'none',type:'Neutral'}
];

/* ================= DOM & STATE ================= */
const startBtn=document.getElementById('start');
const pidInput=document.getElementById('pid');
const trialCounter=document.getElementById('trialCounter');
const fixation=document.getElementById('fixation');
const countdownEl=document.getElementById('countdown');
const stim=document.getElementById('stimulus');

let sequenceMain=[],trialIndex=0,stimulusActive=false,tStimOn=null,logs=[],startType=null,audioCtx=null;

/* ================= UTILITIES ================= */
function randBetween(a,b){return a+Math.random()*(b-a);}
function nowIso(){return(new Date()).toISOString();}
function seededShuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function validMaxRun(seq,maxRun){let runType=null,runLen=0;for(let i=0;i<seq.length;i++){const t=seq[i].type;if(t===runType) runLen++; else {runType=t; runLen=1;}if(runLen>maxRun) return false;}return true;}
function buildBaseList(){const list=[];neonColors.forEach(c=>{for(let i=0;i<CONFIG.repsPerColor;i++)list.push({...c});});neutralColors.forEach(c=>{for(let i=0;i<CONFIG.repsPerColor;i++)list.push({...c});});return list;}
function generateSequence(){const base=buildBaseList();for(let attempt=0;attempt<1000;attempt++){let seq=seededShuffle(base);if(validMaxRun(seq,CONFIG.maxSameTypeRun))return seq;}return base();}

/* ================= AUDIO BEEP ================= */
function playBeep(freq=600,dur=0.12){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;g.gain.setValueAtTime(0.12,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}

/* ================= START ================= */
startBtn.addEventListener('click',()=>{
  const pid=pidInput.value.trim(); if(!pid){alert('Please enter Participant ID'); return;}
  const num=parseInt(pid.replace(/\D/g,''))||Math.floor(Math.random()*100);
  startType=(num%2===0)?'Neon':'Neutral';
  sequenceMain=generateSequence();
  trialIndex=0; logs=[];
  document.getElementById('container').style.display='none';
  showCountdown(3);
});

/* ================= COUNTDOWN ================= */
function showCountdown(n){
  if(n===0){countdownEl.style.display='none'; showFixation(); return;}
  countdownEl.style.display='block';
  countdownEl.textContent=n;
  playBeep();
  setTimeout(()=>showCountdown(n-1),1000);
}

/* ================= TRIAL FLOW ================= */
function showFixation(){
  fixation.style.display='block';
  let fixationDuration = randBetween(CONFIG.fixationMsMin,CONFIG.fixationMsMax);
  let itiDuration = randBetween(CONFIG.itiMinMs,CONFIG.itiMaxMs);
  setTimeout(()=>{
    fixation.style.display='none';
    setTimeout(showColor, itiDuration);
  }, fixationDuration);
}
function showColor(){
  if(trialIndex>=sequenceMain.length)return finishExperiment();
  const cur=sequenceMain[trialIndex];
  // random position for unpredictability
  stim.style.top = `${randBetween(20,70)}vh`;
  stim.style.left = `${randBetween(10,80)}vw`;
  stim.style.background = cur.color;
  stim.style.boxShadow = cur.glow;
  stim.style.display='block';
  trialCounter.textContent=`Trial ${trialIndex+1} of ${sequenceMain.length}`;
  tStimOn=performance.now(); stimulusActive=true;
}
function recordReaction(){
  if(!stimulusActive)return;
  const tNow=performance.now(); const rt=Math.round(tNow-tStimOn);
  const cur=sequenceMain[trialIndex]; stim.style.display='none'; stim.style.boxShadow='none'; stimulusActive=false;
  logs.push({participant:pidInput.value.trim(),timestamp:nowIso(),trialNum:trialIndex+1,type:cur.type,colorName:cur.name,rt_ms:rt});
  trialIndex++; if(trialIndex<sequenceMain.length)showFixation(); else finishExperiment();
}

/* ================= FINISH & CSV ================= */
function finishExperiment(){
  const mainLogs=logs;
  const neonRTs=mainLogs.filter(l=>l.type==='Neon').map(l=>l.rt_ms);
  const neutralRTs=mainLogs.filter(l=>l.type==='Neutral').map(l=>l.rt_ms);
  const mean=(arr)=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;
  const avgNeon=mean(neonRTs), avgNeutral=mean(neutralRTs);
  let tableRows=mainLogs.map(l=>`<tr><td>${l.trialNum}</td><td>${l.type}</td><td>${l.colorName}</td><td>${l.rt_ms}</td></tr>`).join('');
  document.body.innerHTML=`
    <div style="padding:20px;">
      <h2>Results — Participant ${pidInput.value.trim()}</h2>
      <p>Average Neon RT: ${avgNeon} ms • Average Neutral RT: ${avgNeutral} ms</p>
      <table>
        <thead><tr><th>Trial</th><th>Type</th><th>Color</th><th>RT (ms)</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
      <button id="download">Download CSV</button>
      <button id="restart" style="margin-left:12px">Restart</button>
    </div>`;
  document.getElementById('download').addEventListener('click',()=>downloadCSV(mainLogs,avgNeon,avgNeutral));
  document.getElementById('restart').addEventListener('click',()=>location.reload());
}

function downloadCSV(logs,avgNeon,avgNeutral){
  const participant=pidInput.value.trim();
  const timestamp_finish=nowIso();
  const neonRTs=logs.filter(l=>l.type==='Neon').map(l=>l.rt_ms).join(';');
  const neutralRTs=logs.filter(l=>l.type==='Neutral').map(l=>l.rt_ms).join(';');
  const lines=[];
  lines.push(['participant','timestamp_finish','neonRTs','neutralRTs','avgNeon','avgNeutral'].join(','));
  lines.push([participant,timestamp_finish,`"${neonRTs}"`,`"${neutralRTs}"`,avgNeon,avgNeutral].join(','));
  const csv=lines.join('\n');
  const a=document.createElement('a'); const blob=new Blob([csv],{type:'text/csv'}); a.href=URL.createObjectURL(blob); a.download=`rt_summary_${participant}_${Date.now()}.csv`; a.click();
}

/* ================= INPUT ================= */
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();recordReaction();}});
stim.addEventListener('click',()=>recordReaction());
document.addEventListener('touchstart',()=>recordReaction(),{passive:true});
</script>
</body>
</html>
