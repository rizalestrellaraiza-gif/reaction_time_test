<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neon vs Neutral — Reaction Time Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
body{margin:0;font-family:Arial,Segoe UI,Helvetica,sans-serif;background:#fff;color:#111;text-align:center;overflow:hidden}
#container{padding:4vh 6%;margin-top:6vh}
h1{font-size:36px;margin-bottom:8px}
p{font-size:18px;line-height:1.5}
input,button{font-size:18px;padding:10px;border-radius:8px}
#start,#download{background:#007bff;color:#fff;border:0;padding:14px 30px;margin-top:12px;cursor:pointer}
#stimulus{width:100vw;height:100vh;display:none;transition:background 0.12s}
#fixation{position:absolute;top:45vh;left:50%;transform:translateX(-50%);font-size:90px;display:none}
#countdown,#trialCounter{position:absolute;width:100%;text-align:center;top:40vh;font-size:80px;display:none}
#trialCounter{top:10px;font-size:22px;color:gray}
#msg{font-size:20px;margin-top:2vh;display:none}
#status{font-size:14px;color:gray;margin-top:8px}
</style>
</head>
<body>
<div id="container">
<h1>🎨 Neon vs Neutral — Reaction Time Test</h1>
<p>
You will see colors appear one at a time. <strong>Press SPACE or TAP</strong> the screen as soon as you see the color.<br>
</p>
<div style="margin-top:10px">
<label for="pid">Participant ID</label><br>
<input id="pid" type="text" placeholder="e.g., P001" style="width:220px">
</div>
<div style="margin-top:14px">
<button id="start">Start Reaction Test</button>
</div>
<div id="status"></div>
<div id="msg"></div>
</div>

<div id="countdown"></div>
<div id="trialCounter"></div>
<div id="fixation">+</div>
<div id="stimulus" role="button" aria-label="Stimulus"></div>

<script>
/* =========================
   CONFIGURATION
   ========================= */
const CONFIG = {
  repsPerColor:2,
  maxSameTypeRun:2,
  practiceTrials:3,
  fixationMsMin:800,
  fixationMsMax:1200,
  itiMinMs:1000,
  itiMaxMs:3000
};

/* =========================
   COLOR SETS
   ========================= */
const neonColors = [
{id:'N1', name:'Neon Yellow', color:'#FFFF00', glow:'0 0 150px #FFFF66', type:'Neon'},
{id:'N2', name:'Neon Pink', color:'#FF00FF', glow:'0 0 150px #FF66FF', type:'Neon'},
{id:'N3', name:'Neon Orange', color:'#FF5E00', glow:'0 0 150px #FF9933', type:'Neon'}
];
const neutralColors = [
{id:'U1', name:'Beige', color:'#E6D8B3', glow:'none', type:'Neutral'},
{id:'U2', name:'Gray', color:'#B0B0B0', glow:'none', type:'Neutral'},
{id:'U3', name:'Light Brown', color:'#C4A484', glow:'none', type:'Neutral'}
];

/* =========================
   DOM ELEMENTS & STATE
   ========================= */
const startBtn = document.getElementById('start');
const pidInput = document.getElementById('pid');
const msgEl = document.getElementById('msg');
const countdownEl = document.getElementById('countdown');
const trialCounter = document.getElementById('trialCounter');
const fixation = document.getElementById('fixation');
const stim = document.getElementById('stimulus');

let sequenceMain=[], sequencePractice=[], currentSeq=[];
let isPractice=true, trialIndex=0, stimulusActive=false, tStimOn=null, logs=[], startType=null;

/* =========================
   UTILITY FUNCTIONS
   ========================= */
function randBetween(a,b){return a + Math.random()*(b-a);}
function nowIso(){return (new Date()).toISOString();}
function seedFromString(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);}return h>>>0;}
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function seededShuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function validMaxRun(seq,maxRun){let runType=null,runLen=0;for(let i=0;i<seq.length;i++){const t=seq[i].type;if(t===runType)runLen++;else{runType=t;runLen=1;}if(runLen>maxRun)return false;}return true;}

/* =========================
   SEQUENCE GENERATION
   ========================= */
function buildBaseList(){
  const list=[];
  neonColors.forEach(c=>{for(let i=0;i<CONFIG.repsPerColor;i++)list.push({...c});});
  neutralColors.forEach(c=>{for(let i=0;i<CONFIG.repsPerColor;i++)list.push({...c});});
  return list;
}

function generateSequence(startType){
  const base=buildBaseList();
  const seedVal=Math.random().toString(36).slice(2,10);
  const rng=mulberry32(seedFromString(seedVal));
  let seq;
  for(let i=0;i<2000;i++){seq=seededShuffle(base,rng);if(validMaxRun(seq,CONFIG.maxSameTypeRun))break;}
  
  // ===============================
  // ORDER BIAS CONTROL
  // Reorder first trial to match startType (Neon-first or Neutral-first)
  // ===============================
  if(startType==='Neon') seq.sort((a,b)=>a.type==='Neon'&&b.type==='Neutral'?-1:1);
  else seq.sort((a,b)=>a.type==='Neutral'&&b.type==='Neon'?-1:1);
  return seq;
}

/* PRACTICE BLOCK */
function buildPractice(){
  return [
    { id:'P1', name:'Practice Blue', color:'#2E6CE6', glow:'0 0 80px #6EA0FF', type:'Practice' },
    { id:'P2', name:'Practice Red', color:'#E63C3C', glow:'0 0 80px #FF7F7F', type:'Practice' },
    { id:'P3', name:'Practice Green', color:'#29C74F', glow:'0 0 80px #7DFF95', type:'Practice' }
  ];
}

/* =========================
   START EXPERIMENT FLOW
   ========================= */
startBtn.addEventListener('click',()=>{
  const pid=pidInput.value.trim();
  if(!pid){alert('Please enter Participant ID'); return;}

  // DETERMINE START TYPE (Neon-first / Neutral-first) based on PID
  const num=parseInt(pid.replace(/\D/g,'')) || Math.floor(Math.random()*100);
  startType=(num%2===0)?'Neon':'Neutral';

  // GENERATE SEQUENCES
  sequenceMain=generateSequence(startType);
  sequencePractice=buildPractice();
  currentSeq=sequencePractice.slice();
  isPractice=true;
  trialIndex=0;
  logs=[];

  // INSTRUCTION + READY MESSAGE
  msgEl.style.display='block';
  msgEl.textContent=`Get ready. Practice trials first. (Your block starts with ${startType} colors)`;
  setTimeout(()=>{msgEl.style.display='none'; showCountdown();},800);
});

/* =========================
   COUNTDOWN BEFORE TRIAL
   ========================= */
function showCountdown(){
  let c=3; 
  countdownEl.style.display='block'; 
  countdownEl.textContent=c;
  const iv=setInterval(()=>{
    c--; 
    if(c>0){countdownEl.textContent=c;}
    else{clearInterval(iv); countdownEl.style.display='none'; showFixation();}
  },1000);
}

/* =========================
   TRIAL FLOW
   ========================= */
function showFixation(){
  fixation.style.display='block';
  // RANDOMIZED fixation duration for fatigue/anticipation control
  setTimeout(()=>{
    fixation.style.display='none';
    // RANDOM ITI (self-paced, stimulus onset independent)
    setTimeout(showColor, randBetween(CONFIG.itiMinMs,CONFIG.itiMaxMs));
  }, randBetween(CONFIG.fixationMsMin,CONFIG.fixationMsMax));
}

function showColor(){
  if(trialIndex>=currentSeq.length) return endBlock();
  const cur=currentSeq[trialIndex];
  stim.style.backgroundColor=cur.color;
  stim.style.boxShadow=cur.glow;
  stim.style.display='block';
  trialCounter.style.display='block';
  trialCounter.textContent=`${isPractice?'Practice':'Trial'} ${trialIndex+1} of ${currentSeq.length}`;
  tStimOn=performance.now();
  stimulusActive=true;
  // ===============================
  // SELF-PACED CONTROL
  // The color remains until participant presses. No auto-lapse or invalid trials.
  // ===============================
}

function recordReaction(){
  if(!stimulusActive) return;
  const tNow=performance.now();
  const rt=Math.round(tNow-tStimOn);
  const cur=currentSeq[trialIndex];
  stim.style.display='none'; stim.style.boxShadow='none'; stimulusActive=false;

  // LOG TRIAL
  logs.push({
    participant: pidInput.value.trim(),
    timestamp: nowIso(),
    trialNum: trialIndex+1,
    type: cur.type,
    colorName: cur.name,
    rt_ms: rt
  });

  trialIndex++;
  if(trialIndex<currentSeq.length) showFixation();
  else endBlock();
}

/* =========================
   END BLOCK
   ========================= */
function endBlock(){
  if(isPractice){
    isPractice=false;
    currentSeq=sequenceMain.slice();
    trialIndex=0;
    msgEl.style.display='block';
    msgEl.textContent='Practice complete. Main test will start now.';
    setTimeout(()=>{msgEl.style.display='none'; showCountdown();},1000);
  } else finishExperiment();
}

/* =========================
   FINISH & CSV SUMMARY
   ========================= */
function finishExperiment(){
  const mainLogs=logs.filter(l=>l.type!=='Practice');
  const neonRTsArr=mainLogs.filter(l=>l.type==='Neon').map(l=>l.rt_ms);
  const neutralRTsArr=mainLogs.filter(l=>l.type==='Neutral').map(l=>l.rt_ms);
  const mean=(arr)=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;
  const avgNeon=mean(neonRTsArr), avgNeutral=mean(neutralRTsArr);

  // RESULTS UI + RESEARCH NOTES (bias control)
  document.body.innerHTML=`
    <div style="padding:20px;">
      <h2>Results — Participant ${pidInput.value.trim()}</h2>
      <p>Average Neon RT: ${avgNeon} ms • Average Neutral RT: ${avgNeutral} ms</p>
      <button id="download">Download CSV</button>
      <button id="restart" style="margin-left:12px">Restart</button>
      <section style="padding:20px;text-align:left;max-width:800px;margin:auto;color:#333;">
        <h3>📘 Research Notes — Bias Control Summary</h3>
        <ul>
          <li>Order Bias: 10 participants start Neon, 10 start Neutral.</li>
          <li>Carryover: Practice block included to minimize learning effects.</li>
          <li>Fatigue & Anticipation: Random ITI and fixation durations.</li>
          <li>Device/Lighting: Instructions enforce same device and brightness.</li>
          <li>Randomization: Seeded shuffle ensures reproducible trial order.</li>
          <li>No invalid trials: Self-paced reaction times recorded for all trials.</li>
        </ul>
      </section>
    </div>`;

  document.getElementById('download').addEventListener('click',()=>downloadCSV(mainLogs,avgNeon,avgNeutral));
  document.getElementById('restart').addEventListener('click',()=>location.reload());
}

/* =========================
   CSV DOWNLOAD (SUMMARY)
   ========================= */
function downloadCSV(logs,avgNeon,avgNeutral){
  const participant=pidInput.value.trim();
  const timestamp_finish=nowIso();
  const neonRTs=logs.filter(l=>l.type==='Neon').map(l=>l.rt_ms).join(';');
  const neutralRTs=logs.filter(l=>l.type==='Neutral').map(l=>l.rt_ms).join(';');
  const lines=[];
  lines.push(['participant','timestamp_finish','avgNeon','avgNeutral','neonRTs','neutralRTs'].join(','));
  lines.push([participant,timestamp_finish,avgNeon,avgNeutral,`"${neonRTs}"`,`"${neutralRTs}"`].join(','));
  const csv=lines.join('\n');
  const a=document.createElement('a');
  const blob=new Blob([csv],{type:'text/csv'});
  a.href=URL.createObjectURL(blob);
  a.download=`rt_summary_${participant}_${Date.now()}.csv`;
  a.click();
}

/* =========================
   INPUT HANDLING
   ========================= */
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();recordReaction();}});
stim.addEventListener('click',()=>{recordReaction();});
document.addEventListener('touchstart',()=>{recordReaction();},{passive:true});
</script>
</body>
</html>
